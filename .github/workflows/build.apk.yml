name: DPF Universe APK Build Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build APK inside Kivy Docker Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostpython \
            -w /home/user/hostpython \
            --entrypoint sh \
            kivy/buildozer -c "echo y | buildozer android debug"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPF-Universe-APK
          path: bin/*.apk
